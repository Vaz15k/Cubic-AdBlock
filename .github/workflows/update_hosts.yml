name: Update Hosts File

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install System dependencies
        run: |
          sudo apt update
          sudo apt install -y zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Update Hosts File
        run: |
          python update_hosts.py

      - name: Update version
        run: |
          python update_version.py
          VERSION=$(grep '^version=' module/module.prop | cut -d'=' -f2)
          echo "MODULE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create zip
        run: |
          if [ -f Cubic-AdBlock.zip ]; then
            echo "Removing existing zip file..."
            rm Cubic-AdBlock.zip
          fi
          cd module
          zip -r9 ../Cubic-AdBlock.zip *

      - name: Update current version
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull origin cubic
          git add .
          git commit -m "Update version: ${{ env.MODULE_VERSION }}"
          git tag "${{ env.MODULE_VERSION }}"

      - name: Push changes to repo
        uses: ad-m/github-push-action@v1.1.0
        with:
          tags: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish on GitHub
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Cubic-AdBlock.zip
          release_name: Cubic AdBlock - ${{ env.MODULE_VERSION }}
          tag: ${{ env.MODULE_VERSION }}
          overwrite: true
          body: |
            ### **Release Notes - ${{ env.MODULE_VERSION }}**

            - Update Hosts File

            ### **Based Hosts List**

            - [Steven Black](https://github.com/StevenBlack/hosts)
            - [NoTrack Tracker Blocklist](https://gitlab.com/quidsup/notrack-blocklists)
            - [GoodBye Ads](https://github.com/jerryn70/GoodbyeAds)
            - [Peter Lowe](https://pgl.yoyo.org/adservers/)
            - [1Hosts](https://o0.pages.dev)
            - [HaGeZi](https://github.com/hagezi/dns-blocklists)
